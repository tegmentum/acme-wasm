[package]
name = "acme-challenge-tls-alpn-01"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/acme-challenge-tls-alpn-01"
readme = "../../README.md"
description = "RFC 8737 TLS-ALPN-01 challenge solver: builds the acme-tls/1 self-signed responder certificate carrying the SHA-256 key-authorization in the acmeIdentifier extension."

[lib]
# Plain rlib — no cdylib. Solvers are consumed by the higher-level
# client (either a Rust binary embedding acme-core directly or the
# acme-http-client component); they do not export their own WIT world.
name = "acme_challenge_tls_alpn_01"

[dependencies]
acme-core = { package = "tegmentum-acme-core", path = "../core" }
# Self-signed cert construction. rcgen produces the DER we hand to the
# TLS listener that presents the acme-tls/1 responder.
rcgen = "0.13"
# id-pe-acmeIdentifier OID (1.3.6.1.5.5.7.1.31) plus the CriticalExtension
# encoding of the octet-string SHA-256 hash (RFC 8737 §3).
x509-cert = "0.2"
sha2 = "0.10"
thiserror = "1"
