[package]
name = "acme-challenge-dns-01"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/acme-challenge-dns-01"
readme = "../../README.md"
description = "RFC 8555 §8.4 DNS-01 challenge solver plus the DnsProvider trait concrete provider crates implement. Ships the solver logic (SHA-256 key-authorization → base64url TXT record contents); each provider crate (dns-providers/cloudflare, etc.) supplies the record-provisioning transport."

[lib]
# Plain rlib — no cdylib.
name = "acme_challenge_dns_01"

[dependencies]
acme-core = { package = "tegmentum-acme-core", path = "../core" }
# SHA-256 of the key authorization → base64url TXT contents (RFC 8555
# §8.4). Same primitive acme-core uses on the token/JWK path; taken
# directly here since the solver receives the pre-computed key
# authorization string.
sha2 = "0.10"
base64 = "0.22"
thiserror = "1"

[dev-dependencies]
# Deterministic P-256 key material for the round-trip tests. acme-core
# already pulls p256 transitively; taking a direct dev-dep just makes
# `use p256::...` in tests explicit.
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
